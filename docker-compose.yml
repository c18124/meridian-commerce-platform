services:
  app:
    build: .
    container_name: ai-chat-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    volumes:
      - ./chat.db:/app/chat.db
      - hf_cache:/root/.cache/huggingface

volumes:
  hf_cache:
